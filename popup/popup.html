<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-area">
        <img src="../icons/icon-48.png" alt="Logo" class="logo-img">
        <h1>WhatsApp Web Extractor</h1>
      </div>
      <span class="badge" id="status-badge">Verificando...</span>
    </header>

    <main class="content">
      <!-- Status da Conexão com o WhatsApp Web -->
      <div class="card status-card">
        <p class="card-title">Status da Conexão</p>
        <p class="status-detail" id="status-detail">Consultando abas abertas...</p>
        <p class="status-line hidden" id="status-line"></p>

        <!-- Só aparece quando a linha (a conta logada) não é detectada na aba -->
        <div class="limit-input-row hidden" id="line-phone-row">
          <label for="line-phone-input" class="input-label">Número da linha (com DDI):</label>
          <input type="text" id="line-phone-input" class="number-input line-phone-input" inputmode="tel" autocomplete="off" spellcheck="false" placeholder="5511999999999">
        </div>
      </div>

      <!-- Configuração de Modo e Limite de Extração -->
      <div class="card options-card" id="options-card">
        <p class="card-title">Opções de Extração</p>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" id="mode-all" name="extraction-mode" value="all">
            <span>Todos os chats da conta</span>
          </label>

          <label class="radio-label">
            <input type="radio" id="mode-limit" name="extraction-mode" value="limit" checked>
            <span>Limitar quantidade (modo teste)</span>
          </label>
        </div>

        <div class="limit-input-row" id="limit-input-row">
          <label for="max-chats-input" class="input-label">Quantidade de chats:</label>
          <input type="number" id="max-chats-input" class="number-input" min="1" max="1000" value="3">
        </div>

        <div class="limit-input-row">
          <label for="safe-delay-input" class="input-label">Intervalo entre conversas (s):</label>
          <input type="number" id="safe-delay-input" class="number-input" min="1" step="0.5" value="2">
        </div>
      </div>

      <!-- Barra de Progresso e Métricas em Tempo Real -->
      <div class="card progress-card hidden" id="progress-container">
        <div class="progress-header">
          <span class="progress-title">Progresso da Extração</span>
          <span class="badge" id="progress-state-badge">Aguardando</span>
        </div>

        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>

        <div class="progress-info-row">
          <span class="progress-label" id="progress-label">0%</span>
        </div>
        <p class="progress-detail" id="progress-detail">Iniciando...</p>
      </div>

      <!-- Botões de Controle do Fluxo -->
      <div class="actions">
        <button id="btn-start-batch" class="btn btn-primary">Iniciar Extração em Lote</button>
        <button id="btn-pause-batch" class="btn btn-secondary hidden">Pausar Extração</button>
        <button id="btn-resume-batch" class="btn btn-primary hidden">Retomar Extração</button>
        <button id="btn-cancel-batch" class="btn btn-danger hidden">Cancelar Extração</button>

        <div class="secondary-actions">
          <button id="btn-check-ready" class="btn btn-secondary btn-sm" disabled>Verificar WhatsApp</button>
          <button id="btn-open-wa" class="btn btn-secondary btn-sm">Abrir WhatsApp Web</button>
        </div>
      </div>

      <!-- Log de Atividades -->
      <div class="log-area" id="log-area">
        <p class="log-entry">Extensão inicializada pronta para uso.</p>
      </div>
    </main>

    <footer class="footer">
      <small>WhatsApp Chat Extractor &bull; Manifest V3</small>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
